; Every call is handed to the application (« Stasis » app sgo), which decides what happens.
[general]
static = yes
writeprotect = yes

[from-trunk]
; A call from the operator: the number called (or the To header) tells whose line it is.
exten => _[+0-9a-zA-Z].,1,Stasis(sgo,inbound,${EXTEN})
 same => n,Hangup()
exten => s,1,Stasis(sgo,inbound,s)
 same => n,Hangup()

[from-app]
; A call made from the application.
exten => _[+0-9].,1,Stasis(sgo,outbound,${EXTEN})
 same => n,Hangup()

[sgo-ring]
; « sgo12-25 »: rings every device where person 12 is signed in (computer, phone), 25 seconds.
exten => _sgo.,1,Dial(${PJSIP_DIAL_CONTACTS(${CUT(EXTEN,-,1)})},${CUT(EXTEN,-,2)})
 same => n,Hangup()
