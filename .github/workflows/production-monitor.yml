name: Production monitor

# Manual only: no schedule. The app is self-hosted (Proxmox), so the target comes
# from the run input or the PRODUCTION_URL repository variable.
on:
  workflow_dispatch:
    inputs:
      production_url:
        description: "Adresse publique à tester (vide = variable de dépôt PRODUCTION_URL)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCTION_URL: ${{ inputs.production_url || vars.PRODUCTION_URL }}
    steps:
      # Fail before npm ci / Chromium install so a missing URL costs seconds, not minutes.
      - name: Check target URL
        run: |
          if [ -z "$PRODUCTION_URL" ]; then
            echo "::error::PRODUCTION_URL absente : renseignez production_url au lancement ou la variable de dépôt PRODUCTION_URL (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Production smoke
        env:
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: node test/production-smoke.cjs
