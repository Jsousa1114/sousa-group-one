name: P0 passkeys verification

on:
  push:
    branches:
      - p0-passkeys-webauthn-20260927
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: p0-passkeys-webauthn-20260927
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Refresh dependency lock
        run: npm install --package-lock-only
      - name: Commit refreshed lock when needed
        shell: bash
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "Sousa Group One CI"
            git config user.email "actions@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: refresh lockfile for WebAuthn"
            git push origin HEAD:p0-passkeys-webauthn-20260927
          fi
      - name: Clean install
        run: npm ci
      - name: Syntax checks
        run: |
          node --check passkey-routes.js
          node --check passkeys.js
          node --check server.js
          node --check account-center.js
      - name: Test suite
        run: npm test
