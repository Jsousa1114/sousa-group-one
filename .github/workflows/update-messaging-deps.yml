name: Update messaging dependency lock

on:
  workflow_dispatch:
  push:
    branches:
      - feature-complete-messaging-suite-20260927
    paths:
      - .github/workflows/update-messaging-deps.yml

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-complete-messaging-suite-20260927
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Web Push dependency and update lock
        run: npm install --save web-push@3.6.7
      - name: Commit dependency files
        run: |
          git config user.name "Sousa Group One CI"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m "Add web push dependency"
          git push origin HEAD:feature-complete-messaging-suite-20260927
