name: Test navigateur en production

# Manual only: it tests a deployed instance, so editing the test must not trigger it.
# The target comes from the run input or the PRODUCTION_URL repository variable.
on:
  workflow_dispatch:
    inputs:
      production_url:
        description: "Adresse publique à tester (vide = variable de dépôt PRODUCTION_URL)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRODUCTION_URL: ${{ inputs.production_url || vars.PRODUCTION_URL }}
    steps:
      # Fail before npm ci / Chromium install so a missing URL costs seconds, not minutes.
      - name: Check target URL
        run: |
          if [ -z "$PRODUCTION_URL" ]; then
            echo "::error::PRODUCTION_URL absente : renseignez production_url au lancement ou la variable de dépôt PRODUCTION_URL (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser test dependencies
        run: |
          npm ci
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test live site in desktop and mobile Chromium
        run: node test/live-browser.cjs
      - name: Upload public login screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-login-screenshots
          path: browser-test-results/
          if-no-files-found: ignore
          retention-days: 2
