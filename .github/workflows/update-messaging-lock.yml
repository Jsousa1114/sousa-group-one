name: Update package lock for messaging V2

on:
  push:
    branches:
      - messaging-v2-15-features-20260927
    paths:
      - package.json

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: messaging-v2-15-features-20260927
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --package-lock-only
      - name: Commit package lock
        run: |
          if git diff --quiet package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Update package lock for web push"
          git push
